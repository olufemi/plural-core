spring.profiles.active=@spring.profiles.active@
spring.application.name=utilities-service
spring.jpa.hibernate.ddl-auto=update
feign.httpclient.disableSslValidation=true
feign.httpclient.enabled=false
feign.okhttp.enabled=true
server.port=7003
#fin.wealth.otp.encrypt.key=ed36e39b7de30ad8db7137af61f898ec
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_HOST:http://localhost:5088/eureka}
logstash.host=${LOGSTASH_HOST:159.65.50.104}
logstash.port=${LOGSTASH_PORT:9700}
spring.zipkin.base-url = ${ZIPKIN_SERVER_URL:http://localhost:9411}
spring.sleuth.sampler.rate = 10
spring.datasource.url=${SPRING_DS_URL:jdbc:mysql://localhost:3306/finwealthpayment?useSSL=false}
spring.datasource.username=${SPRING_DS_USERNAME:test}
spring.datasource.password=${SPRING_DS_PASS:test}
fin.wealth.conf.param.authKey=${LT_AUTH_KEY}
fin.wealth.conf.param.ccyCode=NGN
fin.wealth.conf.param.baseCcy=USD

fin.wealth.otp.expiry-period-in-minutes=10
fin.wealth.otp.encrypt.key=${UTILITY_OTP_KEY:ed36e39b7de30ad8db7137af61f898ec}
fin.wealth.otp.retry=3

## Server connections configuration
server.max-http-header-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB
spring.jpa.open-in-view=false


#spring.datasource.hikari.maximumPoolSize=${HIKARI_CONNECTION_MAX_POOL_SIZE:20}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

############################################
# RabbitMQ Configuration
############################################

spring.rabbitmq.host=${RABBITMQ_SERVER:188.166.147.29}
spring.rabbitmq.port=${RABBITMQ_SERVER_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_SERVER_USER:finwealth}
spring.rabbitmq.password=${RABBITMQ_SERVER_PWD:finwealth123}

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2

app.email.provider=${APP_EMAIL_PROVIDER:SMTP}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:support@finacialwealth.com}
spring.mail.password=${SMTP_PASSWORD:${YOUR_ROTATED_PASSWORD:}}
app.mail.from=${SMTP_FROM:support@finacialwealth.com}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}

sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:${app.mail.from}}
sendgrid.from.name=${SENDGRID_FROM_NAME:Plural}

fcm.push.enabled=${FCM_PUSH_ENABLED:false}
fcm.project.id=${FCM_PROJECT_ID:}
fcm.service.account.file=${FCM_SERVICE_ACCOUNT_FILE:}

spring.boot.admin.notify.mail.enabled=false
